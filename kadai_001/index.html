<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="架空のカメラマン Kazuki Asahina のポートフォリオサイト">
  <title>My Profile</title>

  <!-- Google Fonts：課題指定の Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- ヘッダー -->
  <header>
    <div class="header-inner">
      <a class="logo" href="#">My Profile</a>

      <nav>
        <a href="#about">About</a>
        <a href="#works">Works</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- メインビジュアル -->
    <div class="main-visual">
      <img src="images/main.png" alt="Canonのカメラ">
    </div>

    <!-- About -->
    <section id="about" class="about">
      <h2>About</h2>

      <div class="about-content">
        <img class="about-image" src="images/about.png" alt="Kazuki Asahinaのプロフィール写真">

        <div class="about-text">
          <h3>Kazuki Asahina</h3>
          <ul>
            <li>25歳 長野県佐久市出身</li>
            <li>ソフトウェア業界でマーケティングに従事</li>
            <li>趣味はカメラ、愛機はCanon</li>
            <li>自然を撮影するのが好きで、海や山によく行く</li>
          </ul>
        </div>
      </div>
    </section>

    <!-- Works -->
    <section id="works" class="works">
      <h2>Works</h2>

      <div class="works-list">
        <article class="works-item">
          <img src="images/works1.png" alt="日本海の風景">
          <p>新潟に訪れた際に、日本海の雄大さを魅了されて撮影した1枚</p>
        </article>

        <article class="works-item">
          <img src="images/works2.png" alt="冠雪した御嶽山">
          <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
        </article>

        <article class="works-item">
          <img src="images/works3.png" alt="京都の古い町並み">
          <p>京都で撮影した、明け方の古き良き日本の町並み</p>
        </article>
      </div>
    </section>
  </main>

  <!-- フッター -->
  <footer>
    <p>© MyProfile. All rights reserved.</p>
  </footer>
</body>
</html>
